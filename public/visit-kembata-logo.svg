<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sunGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E58B00"/>
      <stop offset="50%" stop-color="#F7A81B"/>
      <stop offset="100%" stop-color="#FFBE33"/>
    </linearGradient>
    <linearGradient id="mountainGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B872A"/>
      <stop offset="60%" stop-color="#146B20"/>
      <stop offset="100%" stop-color="#0E4E16"/>
    </linearGradient>
    <linearGradient id="textGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#186E25"/>
      <stop offset="100%" stop-color="#0F4917"/>
    </linearGradient>
  </defs>

  <!-- 11 Sun Rays Radiating outward -->
  <!-- Center ray (0 deg / 90 vertical) -->
  <polygon points="500,70 493,170 507,170" fill="url(#sunGold)"/>
  <!-- Left rays -->
  <polygon points="445,85 448,180 461,173" fill="url(#sunGold)"/>
  <polygon points="395,115 407,200 419,189" fill="url(#sunGold)"/>
  <polygon points="355,160 375,230 384,217" fill="url(#sunGold)"/>
  <polygon points="330,215 356,270 363,254" fill="url(#sunGold)"/>
  <polygon points="318,278 348,318 352,301" fill="url(#sunGold)"/>
  <!-- Right rays -->
  <polygon points="555,85 539,173 552,180" fill="url(#sunGold)"/>
  <polygon points="605,115 581,189 593,200" fill="url(#sunGold)"/>
  <polygon points="645,160 616,217 625,230" fill="url(#sunGold)"/>
  <polygon points="670,215 637,254 644,270" fill="url(#sunGold)"/>
  <polygon points="682,278 648,301 652,318" fill="url(#sunGold)"/>

  <!-- Sun Arch (Crescent disk) -->
  <path d="M 335,280 C 345,180 415,120 500,120 C 585,120 655,180 665,280 C 635,225 575,185 500,185 C 425,185 365,225 335,280 Z" fill="url(#sunGold)"/>

  <!-- Mount Ambericho / Rolling Mountains -->
  <path d="M 80,395 C 130,375 220,335 340,290 C 375,275 425,320 460,335 C 495,300 540,270 590,295 C 640,320 670,360 740,375 C 810,390 890,405 920,425 C 830,410 740,395 650,380 C 550,385 450,420 340,430 C 230,440 140,410 80,395 Z" fill="#0C3E12" opacity="0.4"/>

  <!-- Main green mountain body -->
  <path d="M 80,395 C 140,375 220,335 340,290 C 385,275 435,335 480,335 C 520,290 560,265 615,290 C 670,315 700,365 770,380 C 840,395 890,410 920,425 C 860,405 770,380 680,375 C 570,385 480,440 370,440 C 240,440 150,405 80,395 Z" fill="url(#mountainGreen)"/>

  <!-- Highlight ridge line -->
  <path d="M 85,395 C 180,350 280,315 340,290 C 390,275 435,325 480,328 C 525,295 565,270 615,290 C 670,310 710,360 780,378 C 850,395 895,412 920,425" stroke="#25A337" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Valley contour / path trail -->
  <path d="M 280,425 C 370,410 460,365 540,355 C 580,350 630,370 700,390" stroke="#0A330F" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Pine tree on mountain slope -->
  <g transform="translate(235, 235) scale(0.65)">
    <rect x="23" y="100" width="4" height="35" fill="#146B20"/>
    <polygon points="25,10 5,60 18,60 2,90 20,90 0,115 50,115 30,90 48,90 32,60 45,60" fill="#1EB032"/>
    <polygon points="25,15 10,58 20,58 7,86 22,86 5,110 45,110 28,86 43,86 30,58 40,58" fill="#18962A"/>
  </g>

  <!-- 3 Hikers climbing mountain ridge -->
  <!-- Hiker 1 (Lead) -->
  <g transform="translate(180, 310) scale(0.48)" fill="#1EB032">
    <circle cx="20" cy="15" r="5"/>
    <path d="M 17,21 L 24,36 L 20,58 L 26,60 L 28,40 L 32,56 L 38,54 L 32,32 L 27,21 Z"/>
    <path d="M 12,24 C 9,25 9,35 13,38 L 17,35 L 15,25 Z"/> <!-- backpack -->
    <line x1="28" y1="22" x2="35" y2="60" stroke="#1EB032" stroke-width="2.5"/> <!-- walking stick -->
  </g>
  <!-- Hiker 2 (Middle) -->
  <g transform="translate(142, 325) scale(0.46)" fill="#1EB032">
    <circle cx="20" cy="15" r="5"/>
    <path d="M 17,21 L 23,35 L 19,56 L 25,58 L 27,39 L 30,54 L 36,52 L 31,31 L 26,21 Z"/>
    <path d="M 12,24 C 9,25 9,35 13,38 L 17,35 L 15,25 Z"/>
    <line x1="27" y1="22" x2="34" y2="58" stroke="#1EB032" stroke-width="2.5"/>
  </g>
  <!-- Hiker 3 (Rear) -->
  <g transform="translate(105, 340) scale(0.44)" fill="#1EB032">
    <circle cx="20" cy="15" r="5"/>
    <path d="M 17,21 L 23,35 L 19,56 L 25,58 L 27,39 L 30,54 L 36,52 L 31,31 L 26,21 Z"/>
    <path d="M 12,24 C 9,25 9,35 13,38 L 17,35 L 15,25 Z"/>
    <line x1="27" y1="22" x2="34" y2="58" stroke="#1EB032" stroke-width="2.5"/>
  </g>

  <!-- "VISIT KEMBATA" Typography -->
  <text x="500" y="540" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, system-ui, sans-serif" font-weight="900" font-size="94" letter-spacing="6" fill="url(#textGreen)">
    VISIT KEMBATA
  </text>
</svg>
